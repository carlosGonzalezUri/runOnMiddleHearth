<div color="light" class="logros">
  <section *ngFor="let progressCard of progressList; index as i">
    <ion-card class="logros--card">
      <ion-card-header>
        <ion-card-title class="logros--title">{{progressCard.ubicacion | translate}}</ion-card-title>
        <ion-card-subtitle class="logros--subtitle">
          {{ 'LITERALS.percentage'  | translate }}
          {{progressCard.distancia_km}}
          {{ 'LITERALS.units' | translate }}
        </ion-card-subtitle>
      </ion-card-header>
    
      <ion-card-content class="logros--content">
        {{progressCard.logro | translate}}
        <img class="logros--icon" src="../../assets/icons/achievement.png" alt="" />
      </ion-card-content>
    </ion-card>
  </section>
</div>
